autogenerated = 0 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto

monitor=,preferred,auto,1.0
#monitor=HDMI-A-4,2560x1440@144,auto,1.25
#monitor=DP-3,1920x1080@144,auto,1.2




#monitor=HDMI-A-4,2560x1440@60,0x0,1.25
#monitor=DP-3,1920x1080@144,2048x100,1.2



# 4K Monitor auf Scale 1 (keine Skalierung, echtes 4K für alle Spiele)
#monitor=HDMI-A-4,3840x2160@60,0x0,1

# Zweitmonitor wird bei 3840 Pixeln auf der X-Achse (rechts daneben) platziert
#monitor=DP-3,1920x1080@144,3840x0,1.2


# Er steht bei 0x0. Skalierung 1.5 bedeutet: Logische Breite ist 2560 (3840 / 1.5)
monitor=HDMI-A-4,3840x2160@60,0x0,2

# monitor=DP-2,3840x2160@60,0x0,2
# Du hattest 3840x0 -> Das erzeugt ein "schwarzes Loch" zwischen den Monitoren, wo die Maus verschwindet.
monitor=DP-3,1920x1080@144,1920x0,1.2








# Zwingt Workspace 1 auf den Samsung (HDMI-A-4)
# "default:true" sorgt dafür, dass Hyprland beim Start diesen Monitor fokussiert
workspace=1, monitor:HDMI-A-4, default:true
workspace=5, monitor:DP-3, default:true






# unscale XWayland
xwayland {
  force_zero_scaling = true
}

###################
### MY PROGRAMS ###
###################
# - waybar
# - wofi
# - hyprlock
# - hyprshot 
# - hyprpaper
# - hypridle
# - swaync

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$browser = app.zen_browser.zen
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun --insensitive


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
 exec-once = nm-applet 
 exec-once = waybar & hyprpaper & swaync & hypridle & 
 exec-once = sleep 1 && $HOME/.config/wallpaper/script/Random_Wallpaper.sh
#exec-once 
# Startet cliphist für Text
exec-once = wl-paste --type text --watch cliphist store

# Startet cliphist für Bilder
exec-once = wl-paste --type image --watch cliphist store





